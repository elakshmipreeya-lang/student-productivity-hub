<!DOCTYPE html>
<html>

<head>
    <title>Student Productivity Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Productivity Hub</h1>

    <p>Manage your daily tasks.</p>

    <h2>Add a Task</h2>

    <form id="taskForm">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task"
        >

        <button type="submit">Add Task</button>

    </form>

    <h2>
        Today's Tasks
        (<span id="taskCount">0</span>)
    </h2>

    <ul id="taskList"></ul>

    <script src="script.js"></script>

</body>

</html>
