<!DOCTYPE html>
<html>

<head>
    <title>Student Productivity Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <h1>📚 Student Productivity Hub</h1>
            <p>Stay organized. Get things done.</p>
        </header>


        <section class="task-section">

            <h2>Add a Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                >

                <button type="submit">
                    Add
                </button>

            </form>

        </section>


        <section class="task-section">

            <div class="task-heading">

                <h2>
                    Today's Tasks
                </h2>

                <span id="taskCount">0</span>

            </div>

            <ul id="taskList"></ul>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
